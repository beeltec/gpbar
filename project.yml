name: GPBar
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    MARKETING_VERSION: '0.3.0'
    GPBAR_UPDATE_FEED_URL: https://github.com/beeltec/gpbar/releases/latest/download/appcast.xml
    GPBAR_UPDATE_PUBLIC_KEY: vJXVcUnnQyP180ceJkipBbIc3z9CNmk2R6tELWdohlQ=
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  GPBar:
    type: application
    platform: macOS
    sources:
      - GPBar
      - Shared
      - path: Packaging/Licenses
        type: folder
        buildPhase: resources
      - path: Packaging/LaunchDaemons/com.beeltec.GPBar.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: GPBar/Info.plist
      properties:
        CFBundleDisplayName: GPBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMultipleInstancesProhibited: true
        SUFeedURL: $(GPBAR_UPDATE_FEED_URL)
        SUPublicEDKey: $(GPBAR_UPDATE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: false
        SUEnableSystemProfiling: false
        SUVerifyUpdateBeforeExtraction: true
        CFBundleURLTypes:
          - CFBundleURLName: GlobalProtect sign-in
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - globalprotectcallback
        LSMinimumSystemVersion: '26.0'
        NSHumanReadableCopyright: 'Copyright © 2026 Christian Beelte'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beeltec.GPBar
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Sparkle
      - target: GPBarLogin
        embed: true
        link: false
        codeSign: true
        copy:
          destination: plugins
      - target: GPBarHelper
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables
  GPBarHelper:
    type: tool
    platform: macOS
    sources:
      - GPBarHelper
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beeltec.GPBar.helper
        SKIP_INSTALL: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: YES
  GPBarLogin:
    type: bundle
    platform: macOS
    sources:
      - GPBarLoginPlugin
    info:
      path: GPBarLoginPlugin/Info.plist
      properties:
        CFBundleIdentifier: com.beeltec.GPBar.login-sso
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GPBarSigningTeam: $(DEVELOPMENT_TEAM)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beeltec.GPBar.login-sso
        SKIP_INSTALL: YES
        CLANG_ENABLE_OBJC_ARC: YES
        MACH_O_TYPE: mh_bundle
    dependencies:
      - sdk: Security.framework
      - sdk: Foundation.framework
schemes:
  GPBar:
    build:
      targets:
        GPBar: all
    run:
      config: Debug
    archive:
      config: Release
