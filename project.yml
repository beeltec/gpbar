name: GPBar
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  GPBar:
    type: application
    platform: macOS
    sources:
      - GPBar
      - Shared
      - path: Packaging/LaunchDaemons/com.beeltec.GPBar.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: GPBar/Info.plist
      properties:
        CFBundleDisplayName: GPBar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: GlobalProtect sign-in
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - globalprotectcallback
        LSMinimumSystemVersion: '26.0'
        NSHumanReadableCopyright: ''
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beeltec.GPBar
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: GPBarHelper
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables
  GPBarHelper:
    type: tool
    platform: macOS
    sources:
      - GPBarHelper
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beeltec.GPBar.helper
        SKIP_INSTALL: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GPBar:
    build:
      targets:
        GPBar: all
    run:
      config: Debug
    archive:
      config: Release
